<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Maxi Abarrotes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root{
      --logo-blue: #1a78c8;
      --logo-green: #2fa34a;
      --accent-orange: #ff8c42;
      --sidebar-bg: #1c2520;
      --light-bg: #f4f7f5;
    }

    body{
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-bg);
    }

    .sidebar{
      background-color: var(--sidebar-bg);
      min-height: 100vh;
      color: #d9e2dd;
    }

    .sidebar .brand{
      color: #fff;
      font-weight: 700;
      padding: 1.2rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar a{
      color: #d9e2dd;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.75rem 1.2rem;
      border-radius: 8px;
      margin: 0.25rem 0.7rem;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .sidebar a i{
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    .sidebar a:hover,
    .sidebar a.active{
      background-color: rgba(255,255,255,0.08);
      color: #fff;
    }

    .metric-card{
      background: #ffffff;
      border-radius: 14px;
      padding: 1.2rem 1.4rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.03);
      height: 100%;
    }

    .metric-value{
      font-size: 1.8rem;
      font-weight: 700;
      color: #111;
    }

    .metric-label{
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #777;
    }

    .topbar{
      background: #fff;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 0.8rem 1.5rem;
    }
  </style>
</head>
<body>

<div class="d-flex">
  <!-- Sidebar -->
  <nav class="sidebar" style="width:230px;">
    <div class="brand">Maxi Abarrotes</div>
    <a href="/dashboard.html" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/productos.html"><i class="bi bi-box-seam"></i> Productos</a>
    <a href="/categorias.html"><i class="bi bi-tags"></i> Categorías</a>
    <a href="/proveedores.html"><i class="bi bi-truck"></i> Proveedores</a>
    <a href="#" id="btnLogout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
  </nav>

  <!-- Contenido -->
  <div class="flex-grow-1">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Panel principal</h5>
      <span id="nombreUsuario" class="text-muted"></span>
    </div>

    <div class="container-fluid p-4">
      <div class="row g-3">
        <div class="col-md-3">
          <div class="metric-card">
            <div class="metric-label">Productos</div>
            <div class="metric-value" id="totalProductos">--</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="metric-card">
            <div class="metric-label">Categorías</div>
            <div class="metric-value" id="totalCategorias">--</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="metric-card">
            <div class="metric-label">Proveedores</div>
            <div class="metric-value" id="totalProveedores">--</div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="metric-card">
            <div class="metric-label">Stock bajo</div>
            <div class="metric-value text-danger" id="totalStockBajo">--</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Protege la página: si no hay sesión, manda al login
  const usuarioGuardado = sessionStorage.getItem("usuario");
  if (!usuarioGuardado) {
    window.location.href = "/index.html";
  } else {
    const usuario = JSON.parse(usuarioGuardado);
    document.getElementById("nombreUsuario").textContent =
      `${usuario.Nombre} (${usuario.Rol})`;
  }

  document.getElementById("btnLogout").addEventListener("click", function (e) {
    e.preventDefault();
    sessionStorage.removeItem("usuario");
    window.location.href = "/index.html";
  });

  async function cargarMetricas() {
    try {
      const [productos, categorias, proveedores] = await Promise.all([
        fetch("/productos").then((r) => r.json()),
        fetch("/categorias").then((r) => r.json()),
        fetch("/proveedores").then((r) => r.json()),
      ]);

      document.getElementById("totalProductos").textContent = productos.length;
      document.getElementById("totalCategorias").textContent = categorias.length;
      document.getElementById("totalProveedores").textContent = proveedores.length;

      const stockBajo = productos.filter(
        (p) => Number(p.StockActual) <= Number(p.StockMinimo),
      ).length;
      document.getElementById("totalStockBajo").textContent = stockBajo;
    } catch (error) {
      console.error("Error cargando métricas", error);
    }
  }

  cargarMetricas();
</script>
</body>
</html>
