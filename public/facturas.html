<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial de facturas - Maxi Abarrotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    body{ padding:2rem; }

    @media print {
      body * { visibility: hidden; }
      #contenidoFactura, #contenidoFactura * { visibility: visible; }
      #contenidoFactura { position: absolute; top: 0; left: 0; width: 100%; }
      .modal-header, .modal-footer { display: none !important; }
    }
  </style>
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0"><i class="bi bi-receipt"></i> Historial de facturas</h3>
  <div>
    <span id="nombreUsuario" class="text-muted me-3"></span>
    <a href="#" id="btnVolver" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
  </div>
</div>

<div class="card-tabla p-3">
  <input type="text" class="form-control mb-3" id="filtro" placeholder="Buscar por número de factura o vendedor..." oninput="renderTabla()">
  <table class="table table-hover align-middle">
    <thead><tr><th>N° Factura</th><th>Fecha</th><th>Vendedor</th><th>Total (sin IVA)</th><th></th></tr></thead>
    <tbody id="tablaFacturas"></tbody>
  </table>
</div>

<div class="modal fade" id="modalFactura" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle de factura</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="contenidoFactura"></div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const usuarioGuardado = sessionStorage.getItem("usuario");
  if (!usuarioGuardado) window.location.href = "/index.html";
  const usuarioActual = JSON.parse(usuarioGuardado || "{}");
  document.getElementById("nombreUsuario").textContent = `${usuarioActual.Nombre} (${usuarioActual.Rol})`;

  // El botón Volver lleva a la pantalla que corresponde a cada rol
  const destinos = {
    Empleado: "/ventas.html",
    Contador: "/contabilidad.html",
    Administrador: "/dashboard.html",
  };
  document.getElementById("btnVolver").href = destinos[usuarioActual.Rol] || "/index.html";

  const modalFactura = new bootstrap.Modal(document.getElementById("modalFactura"));
  let facturas = [];

  async function cargarFacturas() {
    facturas = await fetch("/facturas").then(r => r.json());
    renderTabla();
  }

  function renderTabla() {
    const texto = document.getElementById("filtro").value.toLowerCase();
    const filtradas = facturas.filter(f =>
      String(f.IDFactura).includes(texto) || f.Vendedor.toLowerCase().includes(texto)
    );

    const tbody = document.getElementById("tablaFacturas");
    if (filtradas.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No hay facturas.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtradas.map(f => `
      <tr>
        <td>${f.IDFactura}</td>
        <td>${new Date(f.FechaFactura).toLocaleString()}</td>
        <td>${f.Vendedor}</td>
        <td>$${Number(f.Total).toLocaleString()}</td>
        <td><button class="btn btn-outline-primary btn-sm" onclick="verFactura(${f.IDFactura})"><i class="bi bi-eye"></i> Ver</button></td>
      </tr>
    `).join("");
  }

  async function verFactura(id) {
    const factura = await fetch(`/facturas/${id}`).then(r => r.json());

    const filas = factura.lineas.map(l => `
      <tr>
        <td>${l.Producto}</td>
        <td>${l.Cantidad}</td>
        <td>$${Number(l.PrecioUnitario).toLocaleString()}</td>
        <td>$${Number(l.Total).toLocaleString()}</td>
      </tr>
    `).join("");

    const subtotal = Number(factura.Total);
    const iva = subtotal * 0.19;
    const totalConIva = subtotal + iva;

    document.getElementById("contenidoFactura").innerHTML = `
      <div class="mb-2"><strong>Maxi Abarrotes</strong></div>
      <div class="text-muted mb-2" style="font-size:0.85rem;">
        Factura N° ${factura.IDFactura}<br>
        Fecha: ${new Date(factura.FechaFactura).toLocaleString()}<br>
        Vendedor: ${factura.Vendedor}
      </div>
      <table class="table table-sm">
        <thead><tr><th>Producto</th><th>Cant.</th><th>P. Unit.</th><th>Subtotal</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
      <div class="text-end" style="font-size:0.95rem;">
        <div>Subtotal: $${subtotal.toLocaleString(undefined, {minimumFractionDigits:2})}</div>
        <div>IVA (19%): $${iva.toLocaleString(undefined, {minimumFractionDigits:2})}</div>
        <div class="fs-5"><strong>Total: $${totalConIva.toLocaleString(undefined, {minimumFractionDigits:2})}</strong></div>
      </div>
    `;

    modalFactura.show();
  }

  cargarFacturas();
</script>
</body>
</html>
