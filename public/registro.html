<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Usuario - Maxi Abarrotes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body{
      font-family: 'Poppins', sans-serif;
      background-color: #f4f7f5;
    }
    .registro-card{
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
      max-width: 480px;
      margin: 3rem auto;
    }
    .btn-primary{
      background-color: #1a78c8;
      border-color: #1a78c8;
    }
    .btn-primary:hover{
      background-color: #0f5ca8;
      border-color: #0f5ca8;
    }
  </style>
</head>
<body>

<div class="registro-card">
  <h4 class="mb-1">Registro de Usuario</h4>
  <p class="text-muted mb-4">Crea una cuenta para acceder al sistema.</p>

  <div id="mensajeExito" class="alert alert-success" style="display:none;"></div>
  <div id="mensajeError" class="alert alert-danger" style="display:none;"></div>

  <form id="formRegistro">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre completo <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="nombre" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Correo electrónico <span class="text-danger">*</span></label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label for="contrasena" class="form-label">Contraseña <span class="text-danger">*</span></label>
      <input type="password" class="form-control" id="contrasena" minlength="6" required>
      <div class="form-text">Mínimo 6 caracteres.</div>
    </div>
    <div class="mb-3">
      <label for="rol" class="form-label">Tipo de usuario</label>
      <select class="form-select" id="rol">
        <option value="Empleado" selected>Empleado</option>
        <option value="Administrador">Administrador</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100 mb-2">Registrarme</button>
    <a href="/index.html" class="btn btn-outline-secondary w-100">Volver al inicio</a>
  </form>
</div>

<script>
  const formRegistro = document.getElementById("formRegistro");
  const mensajeExito = document.getElementById("mensajeExito");
  const mensajeError = document.getElementById("mensajeError");

  formRegistro.addEventListener("submit", async function (e) {
    e.preventDefault();
    mensajeExito.style.display = "none";
    mensajeError.style.display = "none";

    const datos = {
      Nombre: document.getElementById("nombre").value,
      Email: document.getElementById("email").value,
      Contrasena: document.getElementById("contrasena").value,
      Rol: document.getElementById("rol").value,
    };

    try {
      const respuesta = await fetch("/usuarios", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos),
      });

      const resultado = await respuesta.json();

      if (!respuesta.ok) {
        const textoError = resultado.errores
          ? resultado.errores.join(" ")
          : resultado.mensaje || "No se pudo registrar el usuario.";
        mensajeError.textContent = textoError;
        mensajeError.style.display = "block";
        return;
      }

      mensajeExito.textContent =
        "¡Usuario creado correctamente! Ya puedes iniciar sesión.";
      mensajeExito.style.display = "block";
      formRegistro.reset();
    } catch (error) {
      mensajeError.textContent = "No se pudo conectar con el servidor.";
      mensajeError.style.display = "block";
    }
  });
</script>
</body>
</html>
