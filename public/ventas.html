<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas - Maxi Abarrotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    body{ padding:2rem; }
  </style>
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0"><i class="bi bi-cash-coin"></i> Módulo de Ventas</h3>
  <div>
    <span id="nombreUsuario" class="text-muted me-3"></span>
    <a href="#" id="btnLogout" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
  </div>
</div>

<div class="row g-3 mb-3">
  <div class="col-md-4">
    <div class="metric-card">
      <div class="metric-label">Ventas hoy</div>
      <div class="metric-value" id="ventasHoy">--</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="metric-card">
      <div class="metric-label">Ingresos hoy</div>
      <div class="metric-value" id="ingresosHoy">--</div>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-md-5">
    <div class="card-tabla p-3">
      <h5 class="mb-3">Registrar venta</h5>
      <div id="mensajeError" class="alert alert-danger" style="display:none;"></div>
      <div id="mensajeExito" class="alert alert-success" style="display:none;"></div>

      <div class="mb-2">
        <label class="form-label">Producto</label>
        <select class="form-select" id="idProducto"></select>
      </div>
      <div class="mb-2">
        <label class="form-label">Cantidad</label>
        <input type="number" class="form-control" id="cantidad" min="1" value="1">
      </div>
      <div class="mb-3 text-muted" id="infoProducto" style="font-size:0.85rem;"></div>
      <button class="btn btn-primary w-100" onclick="registrarVenta()">
        <i class="bi bi-check-circle"></i> Registrar venta
      </button>
    </div>
  </div>

  <div class="col-md-7">
    <div class="card-tabla p-3">
      <h5 class="mb-3">Últimas ventas</h5>
      <table class="table table-hover align-middle">
        <thead><tr><th>Producto</th><th>Cant.</th><th>Total</th><th>Vendedor</th><th>Fecha</th></tr></thead>
        <tbody id="tablaVentas"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const usuarioGuardado = sessionStorage.getItem("usuario");
  if (!usuarioGuardado) window.location.href = "/index.html";
  const usuarioActual = JSON.parse(usuarioGuardado || "{}");
  document.getElementById("nombreUsuario").textContent = `${usuarioActual.Nombre} (${usuarioActual.Rol})`;

  document.getElementById("btnLogout").addEventListener("click", function (e) {
    e.preventDefault();
    sessionStorage.removeItem("usuario");
    window.location.href = "/index.html";
  });

  let productos = [];

  async function cargarProductos() {
    productos = await fetch("/productos").then(r => r.json());
    const select = document.getElementById("idProducto");
    select.innerHTML = productos
      .map(p => `<option value="${p.IDProducto}">${p.Nombre} (stock: ${p.StockActual})</option>`)
      .join("");
    mostrarInfoProducto();
  }

  function mostrarInfoProducto() {
    const id = Number(document.getElementById("idProducto").value);
    const producto = productos.find(p => p.IDProducto === id);
    const info = document.getElementById("infoProducto");
    if (producto) {
      info.textContent = `Precio: $${Number(producto.PrecioVenta).toLocaleString()} | Stock disponible: ${producto.StockActual}`;
    }
  }

  document.getElementById("idProducto").addEventListener("change", mostrarInfoProducto);

  async function cargarResumen() {
    const resumen = await fetch("/ventas/resumen-hoy").then(r => r.json());
    document.getElementById("ventasHoy").textContent = resumen.totalVentas;
    document.getElementById("ingresosHoy").textContent = `$${Number(resumen.totalIngresos).toLocaleString()}`;
  }

  async function cargarVentas() {
    const ventas = await fetch("/ventas").then(r => r.json());
    const tbody = document.getElementById("tablaVentas");
    tbody.innerHTML = "";
    ventas.slice(0, 15).forEach(v => {
      tbody.innerHTML += `
        <tr>
          <td>${v.Producto}</td>
          <td>${v.Cantidad}</td>
          <td>$${Number(v.Total).toLocaleString()}</td>
          <td>${v.Usuario}</td>
          <td>${new Date(v.FechaVenta).toLocaleString()}</td>
        </tr>`;
    });
  }

  async function registrarVenta() {
    const mensajeError = document.getElementById("mensajeError");
    const mensajeExito = document.getElementById("mensajeExito");
    mensajeError.style.display = "none";
    mensajeExito.style.display = "none";

    const datos = {
      IDProducto: Number(document.getElementById("idProducto").value),
      Cantidad: Number(document.getElementById("cantidad").value),
      IDUsuario: usuarioActual.IDUsuario,
    };

    const respuesta = await fetch("/ventas", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
    });
    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      mensajeError.textContent = resultado.mensaje || "No se pudo registrar la venta.";
      mensajeError.style.display = "block";
      return;
    }

    mensajeExito.textContent = `Venta registrada por $${Number(resultado.Total).toLocaleString()}`;
    mensajeExito.style.display = "block";

    await cargarProductos();
    await cargarResumen();
    await cargarVentas();
  }

  (async function init() {
    await cargarProductos();
    await cargarResumen();
    await cargarVentas();
  })();
</script>
</body>
</html>
