<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proveedores - Maxi Abarrotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{ font-family:'Poppins', sans-serif; background:#f4f7f5; padding:2rem; }
    .btn-primary{ background-color:#1a78c8; border-color:#1a78c8; }
    .btn-primary:hover{ background-color:#0f5ca8; border-color:#0f5ca8; }
    .card-tabla{ background:#fff; border-radius:14px; padding:1.5rem; box-shadow:0 6px 20px rgba(0,0,0,0.04); }
  </style>
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Gestión de Proveedores</h3>
  <div>
    <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm">← Dashboard</a>
    <button class="btn btn-primary btn-sm" onclick="abrirModal()">+ Nuevo proveedor</button>
  </div>
</div>

<div class="card-tabla">
  <table class="table table-hover align-middle">
    <thead><tr><th>Nombre</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>NIT</th><th></th></tr></thead>
    <tbody id="tablaProveedores"></tbody>
  </table>
</div>

<div class="modal fade" id="modalProveedor" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tituloModal">Nuevo proveedor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="mensajeModalError" class="alert alert-danger" style="display:none;"></div>
        <form id="formProveedor">
          <input type="hidden" id="idProveedor">
          <div class="mb-2">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Contacto</label>
            <input type="text" class="form-control" id="contacto">
          </div>
          <div class="row">
            <div class="col-md-6 mb-2">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="telefono">
            </div>
            <div class="col-md-6 mb-2">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" id="direccion">
          </div>
          <div class="mb-2">
            <label class="form-label">NIT</label>
            <input type="text" class="form-control" id="nit">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarProveedor()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  if (!sessionStorage.getItem("usuario")) window.location.href = "/index.html";

  const modalProveedor = new bootstrap.Modal(document.getElementById("modalProveedor"));

  async function cargarProveedores() {
    const proveedores = await fetch("/proveedores").then(r => r.json());
    const tbody = document.getElementById("tablaProveedores");
    tbody.innerHTML = "";
    proveedores.forEach(p => {
      tbody.innerHTML += `
        <tr>
          <td>${p.Nombre}</td>
          <td>${p.Contacto || ""}</td>
          <td>${p.Telefono || ""}</td>
          <td>${p.Email || ""}</td>
          <td>${p.NIT || ""}</td>
          <td>
            <button class="btn btn-outline-primary btn-sm" onclick="editarProveedor(${p.IDProveedor})">Editar</button>
            <button class="btn btn-outline-danger btn-sm" onclick="eliminarProveedor(${p.IDProveedor})">Eliminar</button>
          </td>
        </tr>`;
    });
  }

  function abrirModal() {
    document.getElementById("tituloModal").textContent = "Nuevo proveedor";
    document.getElementById("formProveedor").reset();
    document.getElementById("idProveedor").value = "";
    document.getElementById("mensajeModalError").style.display = "none";
    modalProveedor.show();
  }

  async function editarProveedor(id) {
    const proveedor = await fetch(`/proveedores/${id}`).then(r => r.json());
    document.getElementById("tituloModal").textContent = "Editar proveedor";
    document.getElementById("idProveedor").value = proveedor.IDProveedor;
    document.getElementById("nombre").value = proveedor.Nombre;
    document.getElementById("contacto").value = proveedor.Contacto || "";
    document.getElementById("telefono").value = proveedor.Telefono || "";
    document.getElementById("email").value = proveedor.Email || "";
    document.getElementById("direccion").value = proveedor.Direccion || "";
    document.getElementById("nit").value = proveedor.NIT || "";
    document.getElementById("mensajeModalError").style.display = "none";
    modalProveedor.show();
  }

  async function guardarProveedor() {
    const id = document.getElementById("idProveedor").value;
    const datos = {
      Nombre: document.getElementById("nombre").value,
      Contacto: document.getElementById("contacto").value,
      Telefono: document.getElementById("telefono").value,
      Email: document.getElementById("email").value,
      Direccion: document.getElementById("direccion").value,
      NIT: document.getElementById("nit").value,
    };

    const url = id ? `/proveedores/${id}` : "/proveedores";
    const metodo = id ? "PUT" : "POST";

    const respuesta = await fetch(url, {
      method: metodo,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
    });
    const resultado = await respuesta.json();

    if (!respuesta.ok) {
      const errorDiv = document.getElementById("mensajeModalError");
      errorDiv.textContent = resultado.errores ? resultado.errores.join(" ") : resultado.mensaje;
      errorDiv.style.display = "block";
      return;
    }

    modalProveedor.hide();
    cargarProveedores();
  }

  async function eliminarProveedor(id) {
    if (!confirm("¿Eliminar este proveedor?")) return;
    await fetch(`/proveedores/${id}`, { method: "DELETE" });
    cargarProveedores();
  }

  cargarProveedores();
</script>
</body>
</html>
