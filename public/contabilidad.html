<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contabilidad - Maxi Abarrotes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{ font-family:'Poppins', sans-serif; background:#f4f7f5; padding:2rem; }
    .card-tabla{ background:#fff; border-radius:14px; padding:1.5rem; box-shadow:0 6px 20px rgba(0,0,0,0.04); }
  </style>
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0"><i class="bi bi-graph-up"></i> Módulo de Contabilidad</h3>
  <div>
    <span id="nombreUsuario" class="text-muted me-3"></span>
    <a href="#" id="btnLogout" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
  </div>
</div>

<div class="card-tabla">
  <p class="text-muted mb-0">
    <i class="bi bi-cone-striped"></i> Este módulo está en construcción.
    Aquí se mostrará la facturación, ingresos y egresos.
  </p>
</div>

<script>
  const usuarioGuardado = sessionStorage.getItem("usuario");
  if (!usuarioGuardado) {
    window.location.href = "/index.html";
  } else {
    const usuario = JSON.parse(usuarioGuardado);
    document.getElementById("nombreUsuario").textContent = `${usuario.Nombre} (${usuario.Rol})`;
  }

  document.getElementById("btnLogout").addEventListener("click", function (e) {
    e.preventDefault();
    sessionStorage.removeItem("usuario");
    window.location.href = "/index.html";
  });
</script>
</body>
</html>
